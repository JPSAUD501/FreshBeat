name: 🐛 Reportar bug
description: Algo não está funcionando como deveria
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu?
      description: Descreva o bug e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Como reproduzir
      description: Passos, comando usado, música/contexto, etc.
    validations:
      required: true
  - type: input
    id: error-code
    attributes:
      label: Código de erro (se houver)
      description: Se o bot respondeu com /support_error_{id}, cole aqui.
  - type: dropdown
    id: locale
    attributes:
      label: Idioma do seu Telegram
      options:
        - pt-BR
        - en-US
        - ja-JP
        - es-ES
        - outro
