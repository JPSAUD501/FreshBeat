services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: freshbeat
      POSTGRES_PASSWORD: freshbeat
      POSTGRES_DB: freshbeat
    expose:
      - '5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U freshbeat -d freshbeat
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    expose:
      - '6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env — sem default por segurança}
    expose:
      - '9000'
      - '9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 10
  minio-init:
    image: minio/mc:latest
    restart: 'no'
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD}@minio:9000
    entrypoint:
      - /bin/sh
      - -c
      - mc mb --ignore-existing local/freshbeat && mc anonymous set download local/freshbeat
    depends_on:
      minio:
        condition: service_healthy
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://freshbeat:freshbeat@postgres:5432/freshbeat
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-freshbeat}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env — sem default por segurança}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/freshbeat}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: sh -c "npm run db:migrate --workspace @freshbeat/database && exec npm run start --workspace @freshbeat/bot"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BOT_USERNAME: ${BOT_USERNAME:-FreshBeatBot}
        NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-https://github.com/JPSAUD501/FreshBeat}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://freshbeat:freshbeat@postgres:5432/freshbeat
      REDIS_URL: redis://redis:6379
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      NODE_ENV: production
      # S3_* completas: o .env compartilhado do Coolify traz S3_PUBLIC_URL, o que
      # ativa o grupo s3 "tudo ou nada" do loadConfig — sem o resto o web sobe mas
      # toda rota dinâmica (ex.: /auth/lastfm) quebra com ConfigError/500.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: freshbeat
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no .env — sem default por segurança}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    expose:
      - '3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  pgdata: null
  redisdata: null
  miniodata: null
